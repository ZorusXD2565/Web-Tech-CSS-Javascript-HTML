<html>
<html>
<head>
    <title>Basic Arithmetic</title>
</head>
<body>

    <h2>Simple JavaScript Arithmetic</h2>
    <p>Check the browser console or click the button to see the math!</p>

    <button onclick="performMath()">Run Math</button>   
    <script>
        function performMath() {
            let a = 10;
            let b = 5;

            let sum = a + b;
            let diff = a - b;
            let product = a * b;
            let quotient = a / b;

            alert("Numbers: a = " + a + ", b = " + b + 
                  "\nSum: " + sum + 
                  "\nDifference: " + diff + 
                  "\nProduct: " + product + 
                  "\nQuotient: " + quotient);
        }
    </script>

</body>
</html>
